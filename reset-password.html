<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Les Artistes — Nouveau mot de passe</title>
<link rel="icon" type="image/png" href="logo-artistes.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --coral:  #FF6B6B;
    --yellow: #FFD93D;
    --teal:   #4ECDC4;
    --violet: #C77DFF;
    --deep:   #1A1025;
    --border: rgba(255,255,255,0.15);
    --muted:  rgba(255,255,255,0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--deep); color: #fff; font-family: 'DM Sans', sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 100%; max-width: 400px; background: rgba(255,255,255,0.07); border: 1px solid var(--border);
          border-radius: 20px; padding: 32px 26px; }
  h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; margin-bottom: 6px; }
  p.sub { color: var(--muted); font-size: .9rem; margin-bottom: 22px; }
  label { display: block; font-size: .8rem; color: var(--muted); margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
          background: rgba(255,255,255,0.06); color: #fff; font-size: 1rem; font-family: inherit; }
  button { width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
           background: linear-gradient(135deg, var(--coral), var(--violet)); color: #fff; font-size: 1rem;
           font-weight: 600; font-family: inherit; }
  button[disabled] { opacity: .6; cursor: default; }
  .alert { display: none; margin-top: 16px; padding: 11px 13px; border-radius: 10px; font-size: .88rem; }
  .alert.error   { display: block; background: rgba(255,107,107,.15); color: var(--coral); }
  .alert.success { display: block; background: rgba(78,205,196,.15); color: var(--teal); }
  a { color: var(--yellow); }
</style>
</head>
<body>
<div class="card">
  <h1>Nouveau mot de passe</h1>
  <p class="sub" id="sub">Vérification du lien...</p>
  <div id="form" style="display:none">
    <label for="pw">Nouveau mot de passe (8 caractères minimum)</label>
    <input type="password" id="pw" autocomplete="new-password">
    <label for="pw2">Confirme le mot de passe</label>
    <input type="password" id="pw2" autocomplete="new-password">
    <button id="btn-save">Enregistrer 🔑</button>
  </div>
  <div class="alert" id="alert"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL  = 'https://ldchxxkmvepvbvhdokot.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkY2h4eGttdmVwdmJ2aGRva290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NDQwNTMsImV4cCI6MjA4OTAyMDA1M30.HJw5-GsHCildEQ28HAB30_YKdiZOdeRJIml5wgLvHos';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function showAlert(msg, type) {
  var el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert ' + (type || 'error');
}

function showForm() {
  document.getElementById('sub').textContent = 'Choisis ton nouveau mot de passe.';
  document.getElementById('form').style.display = 'block';
}

// Le lien de l'email ouvre une session de récupération (jetons dans l'URL, lus par supabase-js)
var ready = false;
sb.auth.onAuthStateChange(function(event, session) {
  if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session && !ready) { ready = true; showForm(); }
});
setTimeout(function() {
  sb.auth.getSession().then(function(r) {
    if (ready) return;
    if (r.data && r.data.session) { ready = true; showForm(); return; }
    document.getElementById('sub').innerHTML = 'Ce lien est invalide ou a expiré. <a href="login.html">Redemande un lien</a>.';
  });
}, 1500);

document.getElementById('btn-save').addEventListener('click', async function() {
  var pw  = document.getElementById('pw').value;
  var pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) { showAlert('❌ Le mot de passe doit faire au moins 8 caractères.'); return; }
  if (pw !== pw2)    { showAlert('❌ Les mots de passe ne correspondent pas.'); return; }
  var btn = this;
  btn.disabled = true;
  var r = await sb.auth.updateUser({ password: pw });
  if (r.error) {
    btn.disabled = false;
    showAlert('❌ ' + r.error.message);
    return;
  }
  showAlert('✅ Mot de passe modifié ! Redirection...', 'success');
  setTimeout(function() { window.location.href = 'events.html'; }, 1500);
});
</script>
</body>
</html>
